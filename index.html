<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>College of Business Kiosk | Grand Canyon University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kiosk-style.css" />
<style>
  /* ---------- Idle Screensaver ---------- */
  #screensaver {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(108,63,160,0.55), rgba(36,21,54,0.96) 70%);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease;
  }
  #screensaver.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #screensaver .ss-inner {
    max-width: 720px;
    padding: 40px 32px;
    text-align: center;
    color: #F7F3FB;
    font-family: 'Manrope', sans-serif;
  }
  #screensaver .ss-mark {
    font-size: clamp(11px, 1.3vw, 14px);
    letter-spacing: 0.32em;
    color: #FFC627;
    font-weight: 700;
    margin-bottom: 22px;
    opacity: 0.9;
  }
  #screensaver .ss-content {
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 500ms ease, transform 500ms ease;
  }
  #screensaver .ss-content.in {
    opacity: 1;
    transform: translateY(0);
  }
  #screensaver.image-slide .ss-inner {
    width: 100vw;
    max-width: none;
    height: 100vh;
    padding: 0;
  }
  #screensaver.image-slide .ss-mark,
  #screensaver.image-slide .ss-dots,
  #screensaver.image-slide .ss-hint {
    display: none;
  }
  #screensaver.image-slide .ss-content {
    width: 100vw;
    height: 100vh;
    min-height: 0;
  }
  #screensaver .ss-image {
    display: block;
    width: 100vw;
    height: 100vh;
    max-height: none;
    object-fit: contain;
  }
  #screensaver .ss-quote {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(24px, 3.4vw, 36px);
    line-height: 1.35;
    margin: 0 0 14px;
  }
  #screensaver .ss-author {
    font-size: 14px;
    color: #D9CDEA;
    letter-spacing: 0.04em;
  }
  #screensaver .ss-fact-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FFC627;
    font-weight: 700;
    margin-bottom: 12px;
  }
  #screensaver .ss-cta-title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(26px, 3.6vw, 40px);
    margin: 0 0 10px;
  }
  #screensaver .ss-cta-sub {
    font-size: 15px;
    color: #D9CDEA;
  }
  #screensaver .ss-hint {
    margin: 14px 0 0;
    font-size: 13px;
    color: #D9CDEA;
    opacity: 0.75;
  }
  #screensaver .ss-action {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 210px;
    min-height: 64px;
    margin-top: 34px;
    padding: 14px 28px;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    background: linear-gradient(105deg, #FFC627 0%, #FFD45C 42%, #FFC627 62%, #E8AE1B 100%);
    background-size: 220% 100%;
    color: #241536;
    font: 800 16px/1 'Manrope', sans-serif;
    letter-spacing: 0.16em;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(255, 198, 39, 0.55), 0 12px 28px rgba(8, 4, 18, 0.28);
    animation: ss-button-pulse 2.2s ease-in-out infinite, ss-button-shimmer 3.6s linear infinite;
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
  }
  #screensaver .ss-action::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(112deg, transparent 25%, rgba(255, 255, 255, 0.7) 48%, transparent 68%);
    transform: translateX(-125%);
    animation: ss-button-sheen 3.6s ease-in-out infinite;
    pointer-events: none;
  }
  #screensaver .ss-action:hover,
  #screensaver .ss-action:focus-visible {
    filter: brightness(1.08);
    box-shadow: 0 0 0 7px rgba(255, 198, 39, 0.16), 0 14px 30px rgba(8, 4, 18, 0.34);
    outline: none;
  }
  #screensaver .ss-action:active {
    transform: scale(0.95);
    filter: brightness(0.96);
    box-shadow: 0 0 0 4px rgba(255, 198, 39, 0.12), 0 6px 14px rgba(8, 4, 18, 0.25);
  }
  #screensaver.image-slide .ss-action {
    display: none;
  }
  @keyframes ss-button-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 198, 39, 0.5), 0 12px 28px rgba(8, 4, 18, 0.28); }
    50% { box-shadow: 0 0 0 13px rgba(255, 198, 39, 0), 0 12px 28px rgba(8, 4, 18, 0.28); }
  }
  @keyframes ss-button-shimmer {
    0%, 100% { background-position: 100% 0; }
    50% { background-position: 0% 0; }
  }
  @keyframes ss-button-sheen {
    0%, 35% { transform: translateX(-125%); }
    70%, 100% { transform: translateX(125%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #screensaver .ss-action,
    #screensaver .ss-action::before {
      animation: none;
    }
  }
  #screensaver .ss-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 26px;
  }
  #screensaver .ss-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 300ms ease, transform 300ms ease;
  }
  #screensaver .ss-dot.active {
    background: #FFC627;
    transform: scale(1.3);
  }
</style>
</head>
<body>

  <!-- Canyon strata background -->
  <div class="strata" aria-hidden="true">
    <div class="layer layer-1"></div>
    <div class="layer layer-2"></div>
    <div class="layer layer-3"></div>
    <div class="layer layer-4"></div>
    <div class="layer layer-5"></div>
  </div>


  <div class="kiosk">

    <header class="kiosk-header">
      <div class="brand-panel">
        <img src="images/logos/gculogohead.png" alt="Grand Canyon University logo" class="brand-logo" />
        <div class="mark">
          <span class="mark-line">GRAND CANYON UNIVERSITY</span>
          <h1>College of Business</h1>
        </div>
      </div>
      <p class="tagline">Touch a tile to get started</p>
    </header>

    <main class="tiles" id="tiles">

      <button class="tile" data-key="faculty" style="--i:0">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="22" r="11" stroke="currentColor" stroke-width="3"/>
            <path d="M12 54c2-11 10-17 20-17s18 6 20 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M32 11 L48 6 L32 1 L16 6 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="tile-text">
          <span class="tile-label">Faculty</span>
          <span class="tile-sub">Meet our professors</span>
        </span>
        <span class="tile-go" aria-hidden="true">&rarr;</span>
      </button>

      <button class="tile" data-key="careerFinder" style="--i:1">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="3"/>
            <path d="M40 24 L34 34 L24 40 L30 30 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" fill="currentColor" fill-opacity="0.15"/>
            <circle cx="32" cy="32" r="2.5" fill="currentColor"/>
          </svg>
        </span>
        <span class="tile-text">
          <span class="tile-label">Career Finder</span>
          <span class="tile-sub">Take the quiz</span>
        </span>
        <span class="tile-go" aria-hidden="true">&rarr;</span>
      </button>

      <button class="tile" data-key="jobs" style="--i:2">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="24" width="44" height="30" rx="4" stroke="currentColor" stroke-width="3"/>
            <path d="M24 24v-6a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v6" stroke="currentColor" stroke-width="3"/>
            <line x1="10" y1="36" x2="54" y2="36" stroke="currentColor" stroke-width="3"/>
          </svg>
        </span>
        <span class="tile-text">
          <span class="tile-label">Job Opportunities</span>
          <span class="tile-sub">Browse open roles</span>
        </span>
        <span class="tile-go" aria-hidden="true">&rarr;</span>
      </button>

      <button class="tile" data-key="programs" style="--i:3">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 20 L32 10 L56 20 L32 30 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <path d="M18 26v14c0 4 6 9 14 9s14-5 14-9V26" stroke="currentColor" stroke-width="3"/>
            <line x1="56" y1="20" x2="56" y2="36" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tile-text">
          <span class="tile-label">Programs &amp; Majors</span>
          <span class="tile-sub">Explore degrees</span>
        </span>
        <span class="tile-go" aria-hidden="true">&rarr;</span>
      </button>

      <button class="tile" data-key="events" style="--i:4" onclick="window.location.href='https://cheryljoehub.github.io/events_1edition/'">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="14" width="44" height="40" rx="4" stroke="currentColor" stroke-width="3"/>
            <line x1="10" y1="26" x2="54" y2="26" stroke="currentColor" stroke-width="3"/>
            <line x1="20" y1="8" x2="20" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <line x1="44" y1="8" x2="44" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <circle cx="22" cy="36" r="2.5" fill="currentColor"/>
            <circle cx="32" cy="36" r="2.5" fill="currentColor"/>
            <circle cx="22" cy="45" r="2.5" fill="currentColor"/>
          </svg>
        </span>
        <span class="tile-text">
          <span class="tile-label">Events This Week</span>
          <span class="tile-sub">Career fairs &amp; workshops</span>
        </span>
        <span class="tile-go" aria-hidden="true">&rarr;</span>
      </button>

      <button class="tile" data-key="wouldYouRather" style="--i:5" onclick="window.location.href='wyr.html'">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="32" r="15" stroke="currentColor" stroke-width="3"/>
            <circle cx="46" cy="32" r="9" stroke="currentColor" stroke-width="3"/>
            <path d="M22 25 v14 M15 32 h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tile-text">
          <span class="tile-label">Would You Rather</span>
          <span class="tile-sub">Vote on today's dilemma</span>
        </span>
        <span class="tile-go" aria-hidden="true">&rarr;</span>
      </button>

    </main>

    <footer class="kiosk-footer">
      <span>Colangelo College of Business</span>
      <span class="dot">&bull;</span>
      <span id="clock"></span>
    </footer>

  </div>

  <!-- Idle screensaver overlay -->
  <div id="screensaver" aria-hidden="true">
    <div class="ss-inner">
      <div class="ss-mark">COLANGELO COLLEGE OF BUSINESS</div>
      <div class="ss-content" id="ss-content"></div>
      <div class="ss-dots" id="ss-dots"></div>
      <button class="ss-action" id="ss-action" type="button" aria-label="Push to continue">PUSH ME</button>
      <div class="ss-hint">Tap anywhere to continue</div>
    </div>
  </div>

<script src="kiosk-script.js"></script>
<script src="idle-screensaver.js"></script>
</body>
</html>
