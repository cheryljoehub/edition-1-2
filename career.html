<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Finder | College of Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="career-style.css"/>
</head>
<body>

  <!-- Canyon strata background -->
  <div class="strata" aria-hidden="true">
    <div class="layer layer-1"></div>
    <div class="layer layer-2"></div>
    <div class="layer layer-3"></div>
    <div class="layer layer-4"></div>
    <div class="layer layer-5"></div>
  </div>

  <button id="backBtn" onclick="goBack()" aria-label="Go back">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>


<script>
  let idleTimer;

  function resetIdleTimer() {
    clearTimeout(idleTimer);

    idleTimer = setTimeout(() => {
      history.back();
    }, 60000); // 1 minute
  }

  // Reset the timer whenever the user does something
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(event => {
    document.addEventListener(event, resetIdleTimer);
  });

  // Start the timer
  resetIdleTimer();
</script>


  <div class="container">
    <span class="mark-line">GRAND CANYON UNIVERSITY</span>
    <h1>Career Finder</h1>
    <p class="subtitle">Find your ideal College of Business career path</p>

    <div id="quiz-box">

      <div id="question"></div>

      <div id="answers"></div>

    </div>

    <div id="result-box" class="hidden">
      <h2>Your Best Career Match</h2>
      <h3 id="result"></h3>
      <p id="result-desc"></p>
      <p id="result-years" class="years"></p>
      <button class="primary-btn" onclick="restart()">Retake Quiz</button>
    </div>

  </div>

  <script src="career-script.js"></script>
</body>
</html>
