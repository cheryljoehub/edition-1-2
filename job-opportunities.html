<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Opportunities</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #241536;
      color: #f7f3fb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #241536 0%, #4f2d7f 100%);
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 28px 32px;
      max-width: 420px;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 16px; line-height: 1.5; color: #e8dff8; }
    a {
      display: inline-block;
      text-decoration: none;
      color: #241536;
      background: #ffc627;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening job opportunities…</h1>
    <p>If the page does not open automatically, use the button below.</p>
    <a href="https://cheryljoehub.github.io/testforjob_2/">Open Job Opportunities</a>
  </div>

  <script>
    window.location.href = "https://cheryljoehub.github.io/testforjob_2/";
  </script>
</body>
</html>
