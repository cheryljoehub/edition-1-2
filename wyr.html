<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Would You Rather | College of Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wyr-style.css" />
</head>
<body>

  <div class="strata" aria-hidden="true">
    <div class="layer layer-1"></div>
    <div class="layer layer-2"></div>
    <div class="layer layer-3"></div>
    <div class="layer layer-4"></div>
    <div class="layer layer-5"></div>
  </div>
<script>
  function goBack() {
    window.location.href = "index.html";
  }
</script>

<button id="backBtn" onclick="goBack()" aria-label="Go back">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M15 5 L8 12 L15 19"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </svg>
</button>

<script>
  let idleTimer;

  function resetIdleTimer() {
    clearTimeout(idleTimer);

    idleTimer = setTimeout(() => {
      history.back();
    }, 20000); // 20 seconds
  }

  // Reset the timer whenever the user does something
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(event => {
    document.addEventListener(event, resetIdleTimer);
  });

  // Start the timer
  resetIdleTimer();
</script>


  <div class="container">
    <span class="mark-line">GRAND CANYON UNIVERSITY</span>
    <h1>Would You Rather</h1>
    <p class="subtitle" id="date-label">Today's business dilemma</p>
    <p class="question-text" id="question-text"></p>

    <div class="card" id="card">
      <div class="option" id="optA" data-side="a">
        <span class="option-label">A</span>
        <span class="option-text" id="optA-text"></span>
        <div class="bar-fill" id="optA-bar"></div>
        <span class="option-pct" id="optA-pct"></span>
      </div>

      <div class="vs">OR</div>

      <div class="option" id="optB" data-side="b">
        <span class="option-label">B</span>
        <span class="option-text" id="optB-text"></span>
        <div class="bar-fill" id="optB-bar"></div>
        <span class="option-pct" id="optB-pct"></span>
      </div>
    </div>

    <p class="vote-count" id="vote-count">0 people voted today</p>
    <p class="vote-note" id="vote-note">Tap an option to vote</p>
    <p class="tomorrow-note">A new dilemma drops every day &mdash; come back tomorrow.</p>
  </div>

<script src="wyr-script.js"></script>
</body>
</html>
